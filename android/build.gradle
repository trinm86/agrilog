buildscript {
    repositories {
        google() // Ensure this is present
        mavenCentral()
    }
    dependencies {
        // Add the Google Services plugin classpath here
        classpath 'com.google.gms:google-services:4.4.0' // Ensure this line is inside the dependencies block
    }
}

allprojects {
    group = 'com.example.my_first_app'
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"  

    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
                ndkVersion flutter.ndkVersion
                compileSdkVersion flutter.compileSdkVersion
                buildToolsVersion "${flutter.compileSdkVersion}.0.0"
            }
        }
        if (project.plugins.hasPlugin("org.jetbrains.kotlin.android")) {
            project.android {
                // Ép các plugin dùng chung compileSdk với máy của bồ (ví dụ 35)
                compileSdkVersion flutter.compileSdkVersion 
            }
        }
    }
     
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}